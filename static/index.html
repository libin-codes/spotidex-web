<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotidex API Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 2rem; max-width: 700px; margin: auto; }
        h1 { font-size: 1.4rem; margin-bottom: 1.5rem; color: #1db954; }
        label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 0.3rem; }
        input, select { width: 100%; padding: 0.6rem; border: 1px solid #333; border-radius: 6px; background: #1a1a1a; color: #eee; font-size: 0.95rem; margin-bottom: 1rem; }
        input:focus, select:focus { outline: none; border-color: #1db954; }
        button { padding: 0.6rem 1.2rem; border: none; border-radius: 6px; font-size: 0.9rem; cursor: pointer; font-weight: 600; }
        .btn-primary { background: #1db954; color: #000; }
        .btn-primary:hover { background: #1ed760; }
        .btn-primary:disabled { background: #333; color: #666; cursor: not-allowed; }
        .btn-download { background: #1db954; color: #000; margin-top: 0.5rem; display: none; }
        .btn-download:hover { background: #1ed760; }
        .section { margin-top: 1.5rem; padding: 1rem; border: 1px solid #222; border-radius: 8px; background: #161616; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .status-badge { padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
        .status-pending { background: #333; color: #aaa; }
        .status-downloading { background: #b8860b; color: #fff; }
        .status-completed { background: #1db954; color: #000; }
        .status-failed { background: #e74c3c; color: #fff; }
        .progress-bar { width: 100%; height: 6px; background: #222; border-radius: 3px; overflow: hidden; margin-bottom: 1rem; }
        .progress-fill { height: 100%; background: #1db954; transition: width 0.3s; width: 0%; }
        .track-list { list-style: none; }
        .track-item { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid #222; font-size: 0.9rem; }
        .track-item:last-child { border-bottom: none; }
        .track-name { flex: 1; }
        .track-artists { color: #888; font-size: 0.8rem; margin-left: 0.5rem; }
        .track-status { font-size: 0.75rem; padding: 0.15rem 0.4rem; border-radius: 3px; }
        .track-status.pending { background: #333; color: #aaa; }
        .track-status.downloading { background: #b8860b; color: #fff; }
        .track-status.completed { background: #1db954; color: #000; }
        .track-status.failed { background: #e74c3c; color: #fff; }
        .track-progress { width: 100%; height: 2px; background: #333; border-radius: 1px; margin-top: 4px; }
        .track-progress-fill { height: 100%; background: #1db954; transition: width 0.3s; }
        .error { color: #e74c3c; font-size: 0.85rem; margin-top: 0.5rem; }
        .hidden { display: none; }
        .row { display: flex; gap: 0.75rem; }
        .row > * { flex: 1; }
    </style>
</head>
<body>
    <h1>Spotidex API Test</h1>

    <div>
        <label for="url">Spotify URL or ID</label>
        <input id="url" type="text" placeholder="https://open.spotify.com/track/4cOdK2wG9Y2kC3VpDw4R0Y">
    </div>

    <div class="row">
        <div>
            <label for="type">Type</label>
            <select id="type">
                <option value="track">Track</option>
                <option value="playlist">Playlist</option>
                <option value="album">Album</option>
            </select>
        </div>
        <div style="flex: 0 0 auto; display: flex; align-items: flex-end;">
            <button id="btn-fetch" class="btn-primary" onclick="fetchModel()">Fetch & Download</button>
        </div>
    </div>

    <div id="error" class="error hidden"></div>

    <div id="progress-section" class="section hidden">
        <div class="status-bar">
            <span id="job-status" class="status-badge status-pending">pending</span>
            <span id="job-count" style="font-size: 0.85rem; color: #aaa;"></span>
        </div>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <ul id="track-list" class="track-list"></ul>
        <button id="btn-download" class="btn-download btn-primary" onclick="downloadFile()">Download File</button>
    </div>

    <script>
        const API = window.location.origin;
        let currentJobId = null;

        function parseSpotifyInput(input) {
            input = input.trim();
            const urlMatch = input.match(/open\.spotify\.com\/(track|playlist|album)\/([a-zA-Z0-9]+)/);
            if (urlMatch) {
                return { type: urlMatch[1], id: urlMatch[2] };
            }
            if (/^[a-zA-Z0-9]{22}$/.test(input)) {
                return { type: document.getElementById('type').value, id: input };
            }
            return null;
        }

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('error').classList.add('hidden');
        }

        function showProgress() {
            document.getElementById('progress-section').classList.remove('hidden');
        }

        function resetUI() {
            currentJobId = null;
            document.getElementById('progress-section').classList.add('hidden');
            document.getElementById('btn-download').style.display = 'none';
            document.getElementById('track-list').innerHTML = '';
            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('job-status').textContent = 'pending';
            document.getElementById('job-status').className = 'status-badge status-pending';
            document.getElementById('job-count').textContent = '';
        }

        async function fetchModel() {
            hideError();
            resetUI();

            const input = document.getElementById('url').value;
            const parsed = parseSpotifyInput(input);
            if (!parsed) {
                showError('Invalid Spotify URL or ID');
                return;
            }

            const btn = document.getElementById('btn-fetch');
            btn.disabled = true;
            btn.textContent = 'Fetching...';

            try {
                const res = await fetch(`${API}/${parsed.type}/${parsed.id}`);
                if (!res.ok) {
                    const detail = await res.json().catch(() => ({}));
                    throw new Error(detail.detail || `HTTP ${res.status}`);
                }
                const model = await res.json();
                await startDownload(parsed.type, model);
            } catch (e) {
                showError(e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Fetch & Download';
            }
        }

        async function startDownload(type, model) {
            const btn = document.getElementById('btn-fetch');
            btn.disabled = true;
            btn.textContent = 'Starting download...';

            try {
                const res = await fetch(`${API}/download/${type}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(model),
                });
                if (!res.ok) {
                    const detail = await res.json().catch(() => ({}));
                    throw new Error(detail.detail || `HTTP ${res.status}`);
                }
                const { job_id } = await res.json();
                currentJobId = job_id;
                showProgress();
                connectWebSocket(job_id);
            } catch (e) {
                showError(e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Fetch & Download';
            }
        }

        function connectWebSocket(jobId) {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${protocol}//${location.host}/download/${jobId}/status`);

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                updateUI(data);
            };

            ws.onclose = () => {
                document.getElementById('btn-download').style.display = 'inline-block';
            };

            ws.onerror = () => {
                showError('WebSocket connection failed');
            };
        }

        function updateUI(job) {
            const statusEl = document.getElementById('job-status');
            statusEl.textContent = job.status;
            statusEl.className = `status-badge status-${job.status}`;

            const totalPercent = job.tracks.reduce((sum, t) => sum + (t.percent || 0), 0);
            const pct = job.total > 0 ? Math.round(totalPercent / job.total) : 0;
            document.getElementById('progress-fill').style.width = `${pct}%`;
            document.getElementById('job-count').textContent =
                `${job.completed}/${job.total} completed` + (job.failed > 0 ? ` \u00b7 ${job.failed} failed` : '');

            const list = document.getElementById('track-list');
            list.innerHTML = '';
            for (const t of job.tracks) {
                const li = document.createElement('li');
                li.className = 'track-item';
                li.style.flexDirection = 'column';
                li.style.alignItems = 'stretch';
                const pctText = t.status === 'downloading' ? ` \u00b7 ${Math.round(t.percent)}%` : '';
                li.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span class="track-name">${t.name}</span>
                        <span class="track-artists">${t.artists.join(', ')}</span>
                        <span class="track-status ${t.status}">${t.status}${pctText}</span>
                    </div>
                    ${t.status === 'downloading' ? `<div class="track-progress"><div class="track-progress-fill" style="width: ${t.percent || 0}%"></div></div>` : ''}
                `;
                list.appendChild(li);
            }
        }

        function downloadFile() {
            if (!currentJobId) return;
            window.open(`${API}/download/${currentJobId}/file`, '_blank');
        }
    </script>
</body>
</html>
